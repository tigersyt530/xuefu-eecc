<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學扶練習與教師題庫</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#183b39;font:17px system-ui,sans-serif}header{background:#164c49;color:white;padding:25px 5%}h1{margin:5px 0;font-size:30px}main{max-width:1250px;margin:auto;padding:20px}button,select,input{font:inherit;padding:10px;border:1px solid #b8ceca;border-radius:9px;background:white;color:inherit}button{cursor:pointer}button.primary,button.active{background:#176b60;color:white;border-color:#176b60}nav,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.panel{background:white;border:1px solid #dce6e2;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#5b716d;font-size:14px}.layout{display:grid;grid-template-columns: minmax(0,1fr) 330px;gap:16px}.paper{width:100%;border:1px solid #ddd}.qrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #e4ebe8}.qrow button{min-width:40px}.wrong{background:#fff0e9}.good{background:#e7f4ec}.item{padding:12px;border-bottom:1px solid #e3eae6}.tag{font-size:13px;color:#53756c}.wide{width:100%}a{color:#176b60}#printarea{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}}@media print{header,main{display:none}#printarea{display:block;color:black}#printarea img{width:100%;max-height:90vh;object-fit:contain;break-after:page}} .progress{display:flex;gap:6px;flex-wrap:wrap}.progress span{padding:7px 12px;border-radius:20px;background:#edf2f0}.progress .on{background:#176b60;color:white}.explain{border-left:4px solid #168575;padding:10px 15px;background:#f0f8f5;margin:12px 0}.reviewgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}.reviewgrid img{width:100%}textarea{font:inherit;width:100%;min-height:85px;border:1px solid #b8ceca;border-radius:8px;padding:8px}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:800px){.reviewgrid{grid-template-columns:1fr}}</style><header><div>學習扶助 · 歷屆試題與模擬測驗 V2.2</div><h1>練習小站 × 教師題庫</h1><div>111–115 年｜國語・數學・英語</div></header><main><nav><button class="active" onclick="mode('student')">學生練習</button><button onclick="mode('teacher')">教師選題與組卷</button><button onclick="mode('history')">練習紀錄與錯題</button><button onclick="mode('review')">錯題學習中心</button><button onclick="mode('simulation')">模擬試題</button></nav><div id="stats" class="muted"></div><div id="filters" class="filters"><select id="sub"><option>數學</option><option>國語</option><option>英語</option></select><select id="grade"><option value="">所有年級</option></select><select id="year"><option value="">所有年度</option></select><select id="tag"><option value="">所有分類</option></select><input id="search" placeholder="搜尋題目關鍵字"></div><div id="body"></div></main><div id="printarea"></div><script src="data.js"></script><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='student',active=null,page=1,responses={},graded=false,chosen=new Set(),custom=null;function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{alert('瀏覽器無法儲存紀錄')}}let overrides=load('xuefuKeys',{}),history=load('xuefuHistory',[]),tags=load('xuefuTags',{});const all=BANK.flatMap(d=>d.questions.map(q=>({...q,d}))), key=q=>overrides[q.id]??q.key, tag=q=>tags[q.id]??q.tag;for(let i=1;i<=6;i++)$('grade').add(new Option(i+' 年級',i));for(let i=115;i>=111;i--)$('year').add(new Option(i+' 年',i));for(let t of ['小數','分數','測量','幾何','統計','整數運算','待分類'])$('tag').add(new Option(t,t));$('stats').textContent=`${BANK.length} 組原卷及答案卷・${all.length} 筆初步題號索引｜分類及自動擷取答案需教師校對`;for(let id of ['sub','grade','year','tag','search'])$(id).oninput=()=>{active=null;custom=null;render()};function filtered(){return all.filter(q=>!q.opts&&q.d.subject===$('sub').value&&(!$('grade').value||q.d.grade==$('grade').value)&&(!$('year').value||q.d.year==$('year').value)&&(!$('tag').value||tag(q)===$('tag').value)&&(!$('search').value||(q.stem+' '+tag(q)).includes($('search').value)))}function mode(t){if(t==='review')queue=[];simRunning=false;tab=t;active=null;custom=null;document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['student','teacher','history','review','simulation'][i]===t));$('filters').style.display=['history','review','simulation'].includes(t)?'none':'flex';render()}function image(d,p){return d.paper.replace('.pdf','-'+p+'.jpg')}function start(id){active=BANK.find(d=>d.id===id);custom=null;page=1;responses={};graded=false;render()}function practice(qs){if(!qs.length)return alert('請先選題');custom=qs;active=null;page=1;responses={};graded=false;tab='student';render()}function current(){return custom||all.filter(q=>q.d.id===active.id)}function answer(id,v){if(graded)return;responses[id]=v;render()}function finish(){if(graded)return;if(simRunning&&current().some(q=>!responses[q.id])&&!confirm('還有未作答的題目，確定交卷？'))return;graded=true;let qs=current(),known=qs.filter(q=>key(q)&&responses[q.id]),right=known.filter(q=>responses[q.id]===key(q)),wrong=known.filter(q=>responses[q.id]!==key(q));history.unshift({date:new Date().toLocaleString('zh-TW'),title:active?.id||(simRunning?simTitle:'自訂練習'),total:qs.length,answered:qs.filter(q=>responses[q.id]).length,graded:known.length,right:right.length,wrong:wrong.map(q=>({id:q.id,response:responses[q.id],key:key(q)}))});save('xuefuHistory',history);recordMistakes(wrong);render()}function changePage(p){page=p;render()}function render(){if(tab==='simulation'){renderSimulation();return}if(tab==='review'){renderReview();return}let list=filtered(),b=$('body');if(tab==='history'){b.innerHTML='<div class="panel"><h2>練習紀錄</h2>'+ (history.length?history.map((h,i)=>`<div class="item">${esc(h.date)}｜${esc(h.title)}｜作答 ${h.answered}/${h.total}｜已評 ${h.graded} 題、答對 ${h.right} 題 <button onclick="review(${i})">查看錯題</button></div>`).join(''):'尚無紀錄')+'</div>';return}if(tab==='student'&&(active||custom)){let qs=current(),q=custom?qs[page-1]:null,d=active||q.d,p=active?page:q.page,shown=custom?[q]:qs.filter(x=>x.page===page);let total=active?active.pages:qs.length;let known=qs.filter(x=>key(x)&&responses[x.id]),right=known.filter(x=>key(x)===responses[x.id]);b.innerHTML=`<div class="panel"><button onclick="leavePractice()">${simRunning?'返回模擬試題':'返回選卷'}</button> <strong>${simRunning?esc(simTitle)+'｜原題：'+esc(d.id)+' 第 '+q.n+' 題':esc(d.id)}</strong><div class="actions"><button onclick="changePage(${Math.max(1,page-1)})">上一頁</button><span>${page} / ${total}</span><button onclick="changePage(${Math.min(total,page+1)})">下一頁</button><a href="${d.paper}" target="_blank">開啟原卷 PDF</a></div>${d.audio?`<div class="muted">英語聽力：請從原始年度壓縮檔解壓後選擇對應 MP3。</div><input type="file" accept="audio/*" onchange="this.nextElementSibling.src=URL.createObjectURL(this.files[0])"><audio controls preload="none"></audio>`:''}</div><div class="layout"><div class="panel"><img class="paper" src="${image(d,p)}" alt="原始試卷第${p}頁"></div><div class="panel"><h3>作答區</h3><p class="muted">${simRunning?'只回答本次抽中的題號；閱讀題組請開啟完整原卷。':'依原卷題號作答；題組請閱讀完整原卷。'}</p>${shown.map(x=>`<div class="qrow ${graded&&key(x)&&responses[x.id]?(key(x)===responses[x.id]?'good':'wrong'):''}"><strong>${x.n}.</strong>${[1,2,3,4].map(v=>`<button class="${responses[x.id]==v?'active':''}" ${graded?'disabled':''} onclick="answer('${x.id}','${v}')">${v}</button>`).join('')}${x.d.subject==='英語'||x.d.subject==='國語'?`<input style="width:100px" placeholder="手寫答案" value="${esc(responses[x.id]||'')}" ${graded?'disabled':''} onchange="responses['${x.id}']=this.value">`:''}${graded?`<small>${key(x)?'參考答案 '+esc(key(x)):'待教師校對'}</small>`:''}</div>`).join('')}<p>已作答 ${qs.filter(x=>responses[x.id]).length}/${qs.length}</p>${graded?`<p>已評分 ${known.length} 題，答對 ${right.length} 題。未校對題目不計分。</p><button class="primary" onclick="review(0)">錯題回顧與解說</button>`:`<button class="primary wide" onclick="finish()">交卷與檢查</button>`}</div></div>`;return}if(tab==='student'){let ds=[...new Set(list.map(q=>q.d))];b.innerHTML='<div class="panel"><h2>選擇一份考古題</h2>'+ds.map(d=>`<div class="item"><strong>${d.year} 年 ${d.subject} ${d.grade} 年級</strong> <span class="muted">${d.pages} 頁</span> <button class="primary" onclick="start('${d.id}')">開始練習</button></div>`).join('')+(ds.length?'':'沒有符合條件的試卷')+'</div>';return}b.innerHTML=`<div class="panel"><h2>教師題庫</h2><div class="actions"><button onclick="selectAll()">選取篩選結果</button><button onclick="chosen.clear();render()">清空</button><button class="primary" onclick="practice(all.filter(q=>chosen.has(q.id)))">開始自訂練習（${chosen.size}）</button><button onclick="printSet()">列印所選原卷頁面</button><button onclick="exportData()">匯出選題 CSV</button></div><p class="muted">目前 ${list.length} 筆；分類為初步標籤，教師可修正。列印保留完整原頁，不裁切題組。</p>${list.map(q=>`<div class="item"><label><input type="checkbox" ${chosen.has(q.id)?'checked':''} onchange="toggle('${q.id}',this.checked)"> ${esc(q.d.id)} 第 ${q.n} 題｜第 ${q.page} 頁</label><div>${esc(q.stem||'請查閱原卷')}</div><div class="actions"><a href="${q.d.paper}#page=${q.page}" target="_blank">原題</a><a href="${q.d.answer}" target="_blank">官方答案卷</a><input aria-label="分類" value="${esc(tag(q))}" style="width:115px" onchange="tags['${q.id}']=this.value;save('xuefuTags',tags)"><input aria-label="答案" placeholder="待校對" value="${esc(key(q))}" style="width:100px" onchange="overrides['${q.id}']=this.value.trim();save('xuefuKeys',overrides)"></div><details><summary>編輯錯題解說與類題</summary>${editor(q)}</details></div>`).join('')}</div>`}function toggle(id,v){v?chosen.add(id):chosen.delete(id);render()}function selectAll(){filtered().forEach(q=>chosen.add(q.id));render()}function review(i){openReview(history[i].wrong)}function printSet(){let qs=all.filter(q=>chosen.has(q.id));if(!qs.length)return alert('請先選題');let imgs=[...new Set(qs.map(q=>image(q.d,q.page)))];$('printarea').innerHTML='<h2>學習扶助選題練習</h2><p>'+qs.map(q=>esc(q.id)).join('、')+'</p>'+imgs.map(x=>`<img src="${x}">`).join('');Promise.all([...$('printarea').querySelectorAll('img')].map(i=>i.decode().catch(()=>{}))).then(()=>window.print())}function exportData(){let qs=all.filter(q=>chosen.has(q.id));if(!qs.length)return alert('請先選題');let csv='\ufeff'+[['題號索引','分類','題幹片段','參考答案','原卷','頁碼'],...qs.map(q=>[q.id,tag(q),q.stem,key(q),q.d.paper,q.page])].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='學扶選題.csv';a.click()}</script><script src="review.js"></script><script src="simulation.js"></script><script src="extra.js"></script><script>render();</script></html>
