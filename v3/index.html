function settings(){let t=$("type").value;$("settings").innerHTML=(t==="year"?'<label>年度 <select id="year">'+[111,112,113,114].map(y=>'<option>'+y+'</option>').join("")+'</select></label>':t==="tag"?'<label>知識點 <select id="tag">'+[...new Set(bank.map(q=>q.tag))].map(t=>'<option>'+t+'</option>').join("")+'</select></label>':t==="weak"?'<p>目前有 '+Object.keys(missed).length+' 道待複習題目。</p>':'')+(t==="year"?"":'<label> 題數 <select id="count"><option>10</option><option>15</option><option>20</option><option>25</option></select></label>')}
function begin(){let t=$("type").value,a=t==="year"?bank.filter(q=>q.year===$("year").value*1):t==="tag"?shuffle(bank.filter(q=>q.tag===$("tag").value)):t==="weak"?shuffle(bank.filter(q=>missed[q.id])):shuffle(bank);if(t!=="year")a=a.slice(0,+$("count").value);start(a)}
function start(a){if(!a.length){alert("沒有符合條件的題目");return}qs=a;idx=0;answers={};mode="quiz";quiz()}
function quiz(){let q=qs[idx],n=Object.keys(answers).length;$("app").innerHTML='<section class="panel"><div class="row"><strong>第 '+(idx+1)+' / '+qs.length+' 題</strong><span class="spacer"></span><small>'+labelQ(q)+'</small></div><p class="muted">已作答 '+n+' 題</p><div class="progress"><span style="width:'+100*n/qs.length+'%"></span></div>'+crop(q)+'<p>請選擇答案</p><div class="options">'+[1,2,3,4].map(k=>'<button class="'+(answers[q.id]===k?"active":"")+'" onclick="pick('+k+')">'+["","①","②","③","④"][k]+'</button>').join("")+'</div><div class="numbers">'+qs.map((x,j)=>'<button class="'+(answers[x.id]?"active":"")+'" onclick="go('+j+')" '+(j===idx?'style="outline:2px solid #d89d35"':"")+'>'+(j+1)+'</button>').join("")+'</div><div class="row"><button onclick="go('+(idx-1)+')" '+(!idx?"disabled":"")+'>上一題</button><span class="spacer"></span><button onclick="go('+(idx+1)+')" '+(idx===qs.length-1?"disabled":"")+'>下一題</button><button class="primary" onclick="finish()">交卷</button></div></section>'}
function pick(k){answers[qs[idx].id]=k;quiz()}function go(i){if(i>=0&&i<qs.length){idx=i;quiz();window.scrollTo(0,0)}}function finish(){if(Object.keys(answers).length<qs.length&&!confirm("還有未作答題目，確定交卷？"))return;wrong=qs.filter(q=>answers[q.id]!==q.key);for(let q of wrong)missed[q.id]={answer:answers[q.id]||0,date:Date.now()};save();mode="result";$("app").innerHTML='<section class="panel"><h2>測驗完成</h2><div class="score">'+(qs.length-wrong.length)+' / '+qs.length+'</div><p>待複習 '+wrong.length+' 題（含未作答）</p><div class="row"><button class="primary" onclick="showReview(0)" '+(!wrong.length?"disabled":"")+'>錯題回顧與解說</button><button onclick="start(wrong)" '+(!wrong.length?"disabled":"")+'>只重練錯題</button><button onclick="home()">返回</button></div></section>'}

const esc3=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const origCrop=crop;

let mastery={};try{mastery=JSON.parse(localStorage.getItem("v3mastery"))||{}}catch{}
function storeM(){try{localStorage.setItem("v3mastery",JSON.stringify(mastery))}catch{}}
function state(q){return mastery[q.id]||(mastery[q.id]={stage:0})}
function dashboard(){let names=["待理解","已看解說","原題答對","同類概念答對","隔日同類概念答對"];let a=Object.values(mastery);$("app").innerHTML='<section class="panel"><h2>學習追蹤</h2>'+names.map((x,i)=>'<p>'+x+'：'+a.filter(v=>v.stage===i).length+' 題</p>').join("")+'<p class="muted">同類概念答對不等於完全精熟；隔日再測使用不同題目。紀錄保存在目前瀏覽器。</p><button onclick="delayed()">隔日再測</button><button onclick="home()">返回</button></section>'}
function delayed(){let a=bank.filter(q=>mastery[q.id]?.stage===3&&Date.now()-mastery[q.id].at>=86400000);if(!a.length)return alert("目前沒有符合隔日再測條件的題目");challenge(a[0].id,true)}
function challenge(id,late=false){let q=bank.find(x=>x.id===id),m=state(q);let pool=fresh.filter(x=>x.tag===q.tag&&x.id!==q.id&&x.id!==m.last);if(q.skill){let exact=pool.filter(x=>x.skill===q.skill);if(exact.length)pool=exact}if(!pool.length)return alert("目前沒有其他同類概念題");let t=shuffle(pool)[0];$("app").innerHTML='<section class="panel"><h2>'+(late?"隔日再測":"同類概念挑戰")+'｜'+q.tag+'</h2><p class="muted">依知識點分類推薦，未必與原題完全同型。</p>'+crop(t)+'<div class="options">'+[1,2,3,4].map(k=>'<button onclick="checkChallenge(\''+id+'\',\''+t.id+'\','+k+','+late+')">'+k+'</button>').join("")+'</div><div id="challengeFeedback"></div><button onclick="reviewHistory()">回錯題中心</button><button onclick="dashboard()">學習追蹤</button></section>'}
function checkChallenge(id,tid,k,late){let t=bank.find(x=>x.id===tid),m=state(bank.find(x=>x.id===id));let f=$("challengeFeedback");if(f.dataset.done)return;f.dataset.done="1";let ok=k===t.key;if(ok){m.stage=late?4:Math.max(m.stage,3);m.at=Date.now();m.last=tid;if(late)delete missed[id];save()}else{m.stage=2;m.last=tid;missed[id]=missed[id]||{answer:0,date:Date.now()};save()}storeM();f.innerHTML='<div class="ex"><strong>'+(ok?"答對了！":"再想一想")+'</strong><p>正確答案：'+t.key+'</p><p>'+esc3(t.ex)+'</p></div><button onclick="challenge(\''+id+'\','+late+')">再挑戰一題</button>'}

const oldFinish=finish;finish=function(){if(Object.keys(answers).length<qs.length&&!confirm("還有未作答題目，確定交卷？"))return;let a=qs.slice();for(let q of a){if(answers[q.id]!==q.key){state(q).stage=0}else if(missed[q.id]){state(q).stage=Math.max(state(q).stage,2)}}storeM();wrong=a.filter(q=>answers[q.id]!==q.key);for(let q of wrong)missed[q.id]={answer:answers[q.id]||0,date:Date.now()};save();mode="result";$("app").innerHTML='<section class="panel"><h2>測驗完成</h2><div class="score">'+(a.length-wrong.length)+' / '+a.length+'</div><p>待複習 '+wrong.length+' 題（含未作答）</p><div class="row"><button class="primary" onclick="showReview(0)" '+(!wrong.length?"disabled":"")+'>錯題回顧與解說</button><button onclick="start(wrong)" '+(!wrong.length?"disabled":"")+'>只重練錯題</button><button onclick="dashboard()">學習追蹤</button><button onclick="home()">返回</button></div></section>'};
