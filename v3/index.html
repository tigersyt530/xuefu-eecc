"},{"id":"114-23","year":114,"n":23,"page":2,"col":1,"top":711,"bottom":886,"key":4,"tag":"幾何","ex":"三張圖卡都至少有一組對邊平行，符合梯形的判斷。"},{"id":"114-24","year":114,"n":24,"page":2,"col":1,"top":886,"bottom":1058,"key":1,"tag":"測量","ex":"沿外框逐段計算，缺少的邊由相對的總長補出，周長54公分。"},{"id":"114-25","year":114,"n":25,"page":2,"col":1,"top":1058,"bottom":1145,"key":4,"tag":"測量","ex":"7×7＝49平方公尺；面積用平方單位。"}];const $=id=>document.getElementById(id);let qs=[],idx=0,answers={},mode="home",wrong=[],selected=new Set();const load=()=>{try{return JSON.parse(localStorage.getItem("v3wrong"))||{}}catch{return {}}};let missed=load();function save(){try{localStorage.setItem("v3wrong",JSON.stringify(missed))}catch{}}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function crop(q){let x=q.col?425:30,w=q.col?390:391,h=q.bottom-q.top;return '<svg class="question" xmlns="http://www.w3.org/2000/svg" viewBox="'+x+' '+q.top+' '+w+' '+h+'" role="img" aria-label="'+q.year+'年度第'+q.n+'題"><image href="../'+q.year+'-ma-4-paper-'+q.page+'.jpg" x="0" y="0" width="841.89" height="1190.55" preserveAspectRatio="none"/></svg>'}
function home(){mode="home";$("app").innerHTML='<section class="panel"><h2>開始練習</h2><p>111～114 年四年級數學，共100道歷屆題。115年上傳卷與114年相同，暫不重複納入。</p><label>練習方式 <select id="type" onchange="settings()"><option value="year">歷屆單卷</option><option value="random">跨年度模擬</option><option value="tag">知識點練習</option><option value="weak">個人弱點</option></select></label><div id="settings" style="margin:15px 0"></div><button class="primary" onclick="begin()">開始作答</button></section><p class="muted">本版採原卷逐題裁切顯示，保留題幹、原選項與圖形。答案依原始答案卷紅色選項核對；解說為新增教學文字。</p>';settings()}
function settings(){let t=$("type").value;$("settings").innerHTML=(t==="year"?'<label>年度 <select id="year">'+[111,112,113,114].map(y=>'<option>'+y+'</option>').join("")+'</select></label>':t==="tag"?'<label>知識點 <select id="tag">'+[...new Set(bank.map(q=>q.tag))].map(t=>'<option>'+t+'</option>').join("")+'</select></label>':t==="weak"?'<p>目前有 '+Object.keys(missed).length+' 道待複習題目。</p>':'')+(t==="year"?"":'<label> 題數 <select id="count"><option>10</option><option>15</option><option>20</option><option>25</option></select></label>')}
function begin(){let t=$("type").value,a=t==="year"?bank.filter(q=>q.year===$("year").value*1):t==="tag"?shuffle(bank.filter(q=>q.tag===$("tag").value)):t==="weak"?shuffle(bank.filter(q=>missed[q.id])):shuffle(bank);if(t!=="year")a=a.slice(0,+$("count").value);start(a)}
function start(a){if(!a.length){alert("沒有符合條件的題目");return}qs=a;idx=0;answers={};mode="quiz";quiz()}
function quiz(){let q=qs[idx],n=Object.keys(answers).length;$("app").innerHTML='<section class="panel"><div class="row"><strong>第 '+(idx+1)+' / '+qs.length+' 題</strong><span class="spacer"></span><small>'+q.year+' 年・原題 '+q.n+'</small></div><p class="muted">已作答 '+n+' 題</p><div class="progress"><span style="width:'+100*n/qs.length+'%"></span></div>'+crop(q)+'<p>請選擇答案</p><div class="options">'+[1,2,3,4].map(k=>'<button class="'+(answers[q.id]===k?"active":"")+'" onclick="pick('+k+')">'+["","①","②","③","④"][k]+'</button>').join("")+'</div><div class="numbers">'+qs.map((x,j)=>'<button class="'+(answers[x.id]?"active":"")+'" onclick="go('+j+')" '+(j===idx?'style="outline:2px solid #d89d35"':"")+'>'+(j+1)+'</button>').join("")+'</div><div class="row"><button onclick="go('+(idx-1)+')" '+(!idx?"disabled":"")+'>上一題</button><span class="spacer"></span><button onclick="go('+(idx+1)+')" '+(idx===qs.length-1?"disabled":"")+'>下一題</button><button class="primary" onclick="finish()">交卷</button></div></section>'}
function pick(k){answers[qs[idx].id]=k;quiz()}function go(i){if(i>=0&&i<qs.length){idx=i;quiz();window.scrollTo(0,0)}}function finish(){if(Object.keys(answers).length<qs.length&&!confirm("還有未作答題目，確定交卷？"))return;wrong=qs.filter(q=>answers[q.id]!==q.key);for(let q of wrong)missed[q.id]={answer:answers[q.id]||0,date:Date.now()};save();mode="result";$("app").innerHTML='<section class="panel"><h2>測驗完成</h2><div class="score">'+(qs.length-wrong.length)+' / '+qs.length+'</div><p>待複習 '+wrong.length+' 題（含未作答）</p><div class="row"><button class="primary" onclick="showReview(0)" '+(!wrong.length?"disabled":"")+'>錯題回顧與解說</button><button onclick="start(wrong)" '+(!wrong.length?"disabled":"")+'>只重練錯題</button><button onclick="home()">返回</button></div></section>'}
function showReview(i){let q=wrong[i];if(!q)return;mode="review";let picked=answers[q.id]??missed[q.id]?.answer;$("app").innerHTML='<section class="panel"><div class="row"><h2>錯題 '+(i+1)+' / '+wrong.length+'</h2><span class="spacer"></span><small>'+q.year+' 年第 '+q.n+' 題</small></div>'+crop(q)+'<div class="options">'+[1,2,3,4].map(k=>'<button disabled class="'+(k===q.key?"good":k===picked?"bad":"")+'">'+k+'</button>').join("")+'</div><p>你的答案：'+(picked||"未作答")+'　正確答案：'+q.key+'</p><div class="ex"><strong>觀念解說｜'+q.tag+'</strong><p>'+q.ex+'</p></div><div class="row"><button onclick="showReview('+(i-1)+')" '+(!i?"disabled":"")+'>上一題</button><button onclick="showReview('+(i+1)+')" '+(i===wrong.length-1?"disabled":"")+'>下一題</button><button class="primary" onclick="retryOne(\''+q.id+'\','+i+')">這題再練習</button><button onclick="start(wrong)">全部錯題再練習</button></div></section>'}
function retryOne(id,i){let q=bank.find(x=>x.id===id);$("app").innerHTML='<section class="panel"><h2>獨立重新作答</h2>'+crop(q)+'<div class="options">'+[1,2,3,4].map(k=>'<button onclick="checkRetry(\''+id+'\','+i+','+k+')">'+k+'</button>').join("")+'</div><p id="feedback"></p><button onclick="showReview('+i+')">返回解說</button></section>'}
function checkRetry(id,i,k){let q=bank.find(x=>x.id===id);if(k===q.key){delete missed[id];save();$("feedback").textContent="答對了！已從待複習清單移除。原題答對不代表已精熟。"}else{$("feedback").textContent="還需要再想一想，可以回到解說。"}}
function reviewHistory(){wrong=bank.filter(q=>missed[q.id]);answers={};if(wrong.length)showReview(0);else $("app").innerHTML='<section class="panel"><h2>錯題學習中心</h2><p>目前沒有待複習題目。</p><button onclick="home()">開始練習</button></section>'}
function teacher(){mode="teacher";$("app").innerHTML='<section class="panel"><h2>教師獨立題庫</h2><div class="row"><select id="ty" onchange="teacherList()"><option value="">所有年度</option>'+[111,112,113,114].map(y=>'<option>'+y+'</option>').join("")+'</select><select id="tt" onchange="teacherList()"><option value="">所有知識點</option>'+[...new Set(bank.map(q=>q.tag))].map(t=>'<option>'+t+'</option>').join("")+'</select><button onclick="start(bank.filter(q=>selected.has(q.id)))">練習所選題目</button><button onclick="printSelected()">列印組卷</button></div><p id="sel"></p><div id="list"></div></section>';teacherList()}
function teacherList(){let a=bank.filter(q=>(!$("ty").value||q.year===$("ty").value*1)&&(!$("tt").value||q.tag===$("tt").value));$("sel").textContent="已選 "+selected.size+" 題｜符合 "+a.length+" 題";$("list").innerHTML=a.map(q=>'<details class="panel"><summary><label><input type="checkbox" '+(selected.has(q.id)?"checked":"")+' onchange="selectQ(\''+q.id+'\',this.checked)"> '+q.year+'年第'+q.n+'題｜'+q.tag+'</label></summary>'+crop(q)+'<p>答案：'+q.key+'</p><p>'+q.ex+'</p></details>').join("")}
function selectQ(id,on){on?selected.add(id):selected.delete(id);$("sel").textContent="已選 "+selected.size+" 題"}
function printSelected(){let a=bank.filter(q=>selected.has(q.id));if(!a.length)return alert("請先選題");$("print").innerHTML='<h1>四年級數學選題練習</h1>'+a.map((q,i)=>'<div class="printq"><strong>第 '+(i+1)+' 題</strong>'+crop(q)+'</div>').join("");setTimeout(()=>window.print(),500)}
home();</script></body></html>
